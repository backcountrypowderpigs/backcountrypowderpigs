name: Build place names

# Builds data/places/<area>.json (English names, resorts, lifts, runs, onsens, parking)
# so the app has them instantly and offline. Runs when areas change, once a month,
# and on demand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/areas.json
      - tools/build_places.py
      - .github/workflows/places.yml
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

concurrency:
  group: places
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pykakasi
      - run: python tools/build_places.py
      - name: Commit if changed
        run: |
          git config user.name "powder-pigs-bot"
          git config user.email "backcountrypowderpigs@users.noreply.github.com"
          git add data/places
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update place names and lifts"
          git pull --rebase origin main
          git push
