<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Backcountry Powder Pigs</title>
<meta name="description" content="Backcountry avalanche map for Japan: GSI topo, JAN bulletin brief, slide pins, offline area packs.">
<meta name="theme-color" content="#123048">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Powder Pigs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Map"></div>

<header class="topbar">
  <button id="areaBtn" class="area-btn" aria-haspopup="dialog" title="Choose your riding area">
    <span id="areaName">Hakuba</span><span id="areaNameJa" class="ja">白馬</span>
    <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
  </button>
  <button id="helpBtn" class="help-btn" aria-label="How to use this app" title="How to use this app">?</button>
  <button id="briefChip" class="brief-chip" aria-label="Open avalanche brief" title="Avalanche brief: today's danger rating for this area">
    <span class="bands" id="chipBands">
      <i data-b="alp"></i><i data-b="tl"></i><i data-b="btl"></i>
    </span>
    <span class="chip-text" id="chipText">Brief</span>
  </button>
</header>

<div id="offlineFlag" class="offline-flag" hidden>Offline</div>
<button id="satFlag" class="sat-flag" title="Satellite image date. Tap to pick another pass" hidden></button>

<div id="boxBar" hidden>
  <div id="boxFrame" class="box-frame" aria-hidden="true"></div>
  <div class="place-panel">
    <div class="place-title" id="boxTitle">Frame the area you'll ride</div>
    <div class="small muted" id="boxInfo"></div>
    <div class="place-actions">
      <button type="button" id="boxCancel" class="btn ghost">Cancel</button>
      <button type="button" id="boxOk" class="btn primary">Use this box</button>
    </div>
  </div>
</div>

<div class="fabs">
  <button id="layersBtn" class="fab" aria-label="Layers" title="Layers: map type, shading and what to show">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zm-9 9l9 5 9-5M3 16l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
  </button>
  <button id="aspectBtn" class="fab" aria-label="Aspect overlay" aria-pressed="false" title="Aspect overlay: colour slopes by the way they face">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 4.5l2.2 7.5L12 19.5 9.8 12z" fill="currentColor"/><text x="12" y="3.6" font-size="4.5" text-anchor="middle" fill="currentColor" font-family="system-ui" font-weight="700">N</text></svg>
  </button>
  <button id="packsBtn" class="fab" aria-label="Area downloads" title="Download areas for offline use">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 4v11m-5-5l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="locateBtn" class="fab" aria-label="Show my position" title="Show my position">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <button id="addBtn" class="fab fab-main" aria-label="Report a slide" title="Drop a pin: slide, slide path or hazard marker">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
  <button id="settingsBtn" class="fab fab-small" aria-label="Settings" title="Settings: name, sharing, satellite, snow-zone heights">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
  </button>
</div>

<div id="readout" class="readout" hidden></div>

<div id="placeBar" class="place-bar" hidden>
  <div class="crosshair" aria-hidden="true"></div>
  <div class="place-panel">
    <div class="place-title" id="placeTitle">Move the map to put the cross on the slide</div>
    <div class="seg" id="placeKind" role="radiogroup">
      <button type="button" data-v="recent" class="on" title="An avalanche you saw recently (black pin)">Recent slide</button>
      <button type="button" data-v="path" title="A path that slides regularly (red skull)">Slide path</button>
      <button type="button" data-v="hazard" title="Rocks, cliffs, creeks, good snow and other markers">Hazard / marker</button>
    </div>
    <div class="place-actions">
      <button type="button" id="placeCancel" class="btn ghost">Cancel</button>
      <button type="button" id="placeOk" class="btn primary">Drop pin here</button>
    </div>
  </div>
</div>

<section id="sheet" class="sheet" role="dialog" aria-modal="false" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grip" id="sheetGrip"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Brief</h2>
    <button id="sheetClose" class="icon-btn" aria-label="Close" title="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
<script src="routes.js"></script>
<script src="share.js"></script>
<script src="sync.js"></script>
</body>
</html>
